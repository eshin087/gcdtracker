name: QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa-local-only
          POSTGRES_DB: gcdtracker_qa
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d gcdtracker_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ""
      PREVIEW_DATABASE_URL: ""
      QA_DATABASE_URL: postgresql://qa:qa-local-only@127.0.0.1:55432/gcdtracker_qa
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Offline production build
        run: npm run build
      - name: Initialize isolated test database
        run: npx tsx scripts/qa-database.ts init
      - name: Preserve legacy data and reapply migration
        run: npx tsx scripts/qa-database.ts migration-check
      - name: Actual PostgreSQL integration tests
        run: npm run test:integration
      - name: Seed deterministic browser fixtures
        run: npx tsx scripts/qa-seed.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local Neon HTTP bridge
        run: |
          mkdir -p .qa
          npx tsx scripts/qa-proxy.ts > .qa/proxy.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:55433/sql; then exit 0; fi
            sleep 1
          done
          cat .qa/proxy.log
          exit 1
      - name: Seeded production build
        env:
          DATABASE_URL: ${{ env.QA_DATABASE_URL }}
          GCD_QA_MODE: "1"
          QA_NEON_HTTP_ENDPOINT: http://127.0.0.1:55433/sql
          IP_HASH_SECRET: qa-only-secret
        run: |
          node -e "require('node:fs').rmSync('.next', { recursive: true, force: true })"
          npm run build
      - name: Start seeded site
        env:
          DATABASE_URL: ${{ env.QA_DATABASE_URL }}
          GCD_QA_MODE: "1"
          QA_NEON_HTTP_ENDPOINT: http://127.0.0.1:55433/sql
          IP_HASH_SECRET: qa-only-secret
        run: |
          npm start -- --hostname 127.0.0.1 --port 3100 > .qa/site.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3100/api/live; then exit 0; fi
            sleep 1
          done
          cat .qa/site.log
          exit 1
      - name: Browser QA
        env:
          QA_SITE_URL: http://127.0.0.1:3100
        run: npm run test:browser
      - name: Preserve QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: |
            .qa/playwright-report/
            .qa/test-results/
            .qa/*.log
            .qa/screenshots/
          if-no-files-found: ignore
          retention-days: 7
