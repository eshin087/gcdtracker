name: robots-census

# Samples robots.txt files from each Common Crawl crawl and counts which AI crawlers
# sites block. New crawls appear roughly monthly; the weekly run picks them up.
on:
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:
    inputs:
      crawl:
        description: "One crawl id, e.g. CC-MAIN-2025-30 (empty = every crawl not yet stored)"
        default: ""
      files:
        description: "WARC files sampled per crawl"
        default: "100"

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Census
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRAWL: ${{ github.event.inputs.crawl }}
          FILES: ${{ github.event.inputs.files || '100' }}
        run: |
          set -euo pipefail
          if [ -n "$CRAWL" ]; then
            node scripts/robots-census.mjs --crawl "$CRAWL" --files "$FILES"
          else
            node scripts/robots-census.mjs --files "$FILES"
          fi
