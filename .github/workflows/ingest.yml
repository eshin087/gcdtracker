name: ingest

# Vercel Hobby cron only runs once a day, so GitHub Actions is the real scheduler.
# Note: GitHub disables scheduled workflows after 60 days without repository activity.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Source to ingest (all, ipranges, wikipedia, wikimedia, moltbook, osm, mcp, botcommits, agentwatch, radar, packages, github, watched, github-signatures, retention)"
        default: "all"

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect and report source outcomes
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SOURCE: ${{ github.event.inputs.source || 'all' }}
        run: node scripts/run-ingest.mjs
